<!-- Muse S Headband Contact Visualization -->
<div class="headband-container" role="img" aria-label="Muse headband contact status">
  <svg class="headband-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <g class="segment-fill" data-channel="TP9">
      <title>TP9: contact status, 0%</title>
      <path d="M 5,50 A 45,45 0 0,1 18,18" pathLength="100" />
    </g>
    <g class="segment-fill" data-channel="AF7">
      <title>AF7: contact status, 0%</title>
      <path d="M 18,18 A 45,45 0 0,1 50,5" pathLength="100" />
    </g>
    <g class="segment-fill" data-channel="AF8">
      <title>AF8: contact status, 0%</title>
      <path d="M 50,5 A 45,45 0 0,1 82,18" pathLength="100" />
    </g>
    <g class="segment-fill" data-channel="TP10">
      <title>TP10: contact status, 0%</title>
      <path d="M 82,18 A 45,45 0 0,1 95,50" pathLength="100" />
    </g>
    <text class="contact-labels" x="5" y="42" text-anchor="middle">TP9</text>
    <text class="contact-labels" x="22" y="18" text-anchor="middle">AF7</text>
    <text class="contact-labels" x="78" y="18" text-anchor="middle">AF8</text>
    <text class="contact-labels" x="95" y="42" text-anchor="middle">TP10</text>
  </svg>
  <div id="all-good-check" class="all-good-check" aria-label="All contacts good">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
    </svg>
  </div>
</div>
